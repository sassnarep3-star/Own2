name: Official source reachability audit
on:
  workflow_dispatch:
  push:
    branches: [arena/082959ac-own2]
    paths: [scripts/audit_sources.py, .github/workflows/source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-checks
          path: audit-output/source-checks.json
          retention-days: 14
